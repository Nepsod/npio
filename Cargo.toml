[package]
name = "npio"
version = "0.0.2"
authors = ["Dominik Adrian Grzywak <starterx4@gmail.com>"]
description = "Nepsod Input-Output library. GIO-inspired library for Linux filesystem and device abstractions."
edition = "2021"
repository = "https://github.com/Nepsod/npio"
license = "LGPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
once_cell = "1.18"
mime_guess = "2.0"
infer = "0.15"
notify = "6.1"
futures = "0.3"
bitflags = "2.4"
directories = "5.0"
chrono = "0.4"
percent-encoding = "2.3"
zbus = { version = "4.0", features = ["tokio"] }
zvariant = "4.0"
serde = { version = "1.0", features = ["derive"] }
md5 = "0.7"
thumbnailify = "0.1.4"
urlencoding = "2.1"
image = "0.24"
udev = "0.5"
libc = "0.2"
uring-file = "0.9"
smol = "2.0"
log = "0.4.27"
thiserror = "1.0"
mime_guess2 = "2.0"
tree_magic_mini = "3.2"
cosmic-mime-apps = { git = "https://github.com/pop-os/cosmic-mime-apps.git" }
mime = "0.3"
shared-mime = { version = "0.1.0", features = ["xdg-runtime"] }
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[lib]
name = "npio"
path = "src/lib.rs"

[[bench]]
name = "job_bench"
harness = false